</defs><style>.art-label{font:11px Arial,sans-serif;fill:#6c879b;text-anchor:middle}.art-caption{font:10px Arial,sans-serif;fill:#93a8b8;text-anchor:middle}.route{stroke:#9ed9e5;stroke-width:1.8;stroke-dasharray:4 5;fill:none;stroke-linecap:round}.cloudroute{stroke:#b4c7dc}.cloudpacket{display:none}.cloud-enabled .cloudpacket{display:block}.step-art .art-label{font-size:10px}.walking-person{animation:walk 5s ease-in-out infinite}.record-dot{animation:pulse 2.6s ease-in-out infinite}.access-tick{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.delete-clip{animation:fadeclip 4s infinite}.motion-paused *{animation-play-state:paused!important}@keyframes walk{0%,100%{transform:translateX(-20px)}50%{transform:translateX(30px)}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes fadeclip{0%,15%,90%,100%{opacity:1;transform:translateX(0)}65%,80%{opacity:0;transform:translateX(63px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.scroll{padding-top:17px}.step{padding-bottom:20px}.step>p{margin-bottom:9px}

